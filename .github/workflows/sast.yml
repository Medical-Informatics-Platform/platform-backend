name: Static Application Security Testing (SAST)

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 1' # weekly scan, every Monday 02:00 UTC

jobs:
  sast:
    name: Static Application Security Testing
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # required for uploading SAST results to github security
    env:
      SEMGREP_CONFIG_RULESETS: >-
        semgrep-rules/generic semgrep-rules/problem-based-packs semgrep-rules/bash semgrep-rules/java auto
        semgrep-rules/yaml semgrep-rules/package_managers p/default
      OPENGREP_EXCLUDE: >-
        *.sarif ci/ Dockerfile* .pre-commit-config.yaml docs/** README.md AGENTS.md
      OPENGREP_SARIF_OUTPUT: sast-semgrep-app.sarif

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 #v7.0.0
        with:
          # renovate: datasource=python-version depName=python
          python-version: '3.14.7'

      - name: Setup tools
        run: bash ci/setup-tools.sh --install-tool opengrep,semgrep-rules

      - name: Run SAST scanning
        run: python ci/sast_scan.py

      - name: Upload Semgrep SARIF to GitHub Security tab
        id: upload_semgrep
        if: always()
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 #v4.38.0
        with:
          sarif_file: ${{ env.OPENGREP_SARIF_OUTPUT }}
          category: semgrep-app

      - name: Upload SARIF artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
        with:
          name: sast-scan-sarif-report
          path: ${{ env.OPENGREP_SARIF_OUTPUT }}
          retention-days: 30
