# Platform-backend configuration (local defaults; override via environment variables)

### EMBEDDED SERVER CONFIGURATION ###
server:
  servlet:
    contextPath: "/services"
  port: 8080
  forward-headers-strategy: native

### DATABASE CONFIGURATION ###
spring:
  datasource:
    url: ${PLATFORM_DB_URL:jdbc:postgresql://127.0.0.1:5433/portal}
    username: ${PLATFORM_DB_USER:portal}
    password: ${PLATFORM_DB_PASSWORD:portalpwd}
    driver-class-name: org.postgresql.Driver
  data:
    jpa:
      repositories:
        bootstrap-mode: default
  jpa:
    hibernate:
      ddl-auto: validate
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  jackson:
    default-property-inclusion: non_null
  security:
    oauth2:
      client:
        registration:
          keycloak:
            authorization-grant-type: authorization_code
            client-id: ${KEYCLOAK_CLIENT_ID:replaceme}
            client-secret: ${KEYCLOAK_CLIENT_SECRET:replaceme}
            provider: keycloak
            scope: openid
        provider:
          keycloak:
            user-name-attribute: preferred_username
            issuer-uri: ${KEYCLOAK_AUTH_URL:https://iam.ebrains.eu/auth/}realms/${KEYCLOAK_REALM:MIP}
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_AUTH_URL:https://iam.ebrains.eu/auth/}realms/${KEYCLOAK_REALM:MIP}

### AUTHENTICATION ###
authentication:
  enabled: ${AUTHENTICATION:1}
  all_datasets_allowed_claim: research_dataset_all
  all_experiments_allowed_claim: research_experiment_all
  dataset_claim_prefix: research_dataset_

### EXTERNAL SERVICES ###
services:
  exaflow:
    analysisUrl: ${EXAFLOW_URL:http://127.0.0.1:5000}/analysis
    inputdataSpecUrl: ${EXAFLOW_URL:http://127.0.0.1:5000}/specifications/inputdata
    preprocessingSpecUrl: ${EXAFLOW_URL:http://127.0.0.1:5000}/specifications/preprocessing
    algorithmsSpecUrl: ${EXAFLOW_URL:http://127.0.0.1:5000}/specifications/algorithms
    attributesUrl: ${EXAFLOW_URL:http://127.0.0.1:5000}/data_models_attributes
    datasets_variables: ${EXAFLOW_URL:http://127.0.0.1:5000}/datasets_variables
    cdesMetadataUrl: ${EXAFLOW_URL:http://127.0.0.1:5000}/cdes_metadata

frontend:
  base-url: ${PLATFORM_UI_BASE_URL:http://localhost:4200}

### PLATFORM VERSION ###
mip:
  version: ${MIP_VERSION:dev}
