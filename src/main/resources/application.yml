# Platform-backend configuration (local defaults; override via environment variables)

### API DOCUMENTATION: off unless asked for, so a deployment does not publish its API description ###
springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:false}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:false}

### EMBEDDED SERVER CONFIGURATION ###
server:
  servlet:
    contextPath: "/services"
    session:
      timeout: ${SESSION_IDLE_TIMEOUT:30m}
      cookie:
        same-site: lax
  port: 8080
  forward-headers-strategy: native

### DATABASE CONFIGURATION ###
spring:
  datasource:
    url: ${PLATFORM_DB_URL:jdbc:postgresql://127.0.0.1:5433/portal}
    username: ${PLATFORM_DB_USER:portal}
    password: ${PLATFORM_DB_PASSWORD:portalpwd}
    driver-class-name: org.postgresql.Driver
  data:
    jpa:
      repositories:
        bootstrap-mode: default
  jpa:
    hibernate:
      ddl-auto: validate
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  jackson:
    default-property-inclusion: non_null
  security:
    oauth2:
      client:
        registration:
          keycloak:
            authorization-grant-type: authorization_code
            client-id: ${KEYCLOAK_CLIENT_ID:replaceme}
            client-secret: ${KEYCLOAK_CLIENT_SECRET:replaceme}
            provider: keycloak
            scope: openid
        provider:
          keycloak:
            user-name-attribute: preferred_username
            issuer-uri: ${KEYCLOAK_AUTH_URL:https://iam.ebrains.eu/auth/}realms/${KEYCLOAK_REALM:MIP}
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_AUTH_URL:https://iam.ebrains.eu/auth/}realms/${KEYCLOAK_REALM:MIP}

### AUTHENTICATION ###
authentication:
  enabled: ${AUTHENTICATION:1}
  all_datasets_allowed_claim: research_dataset_all
  all_experiments_allowed_claim: research_experiment_all
  dataset_claim_prefix: research_dataset_
  # Public Keycloak client (device flow) for `mip login` on users' own computers; empty = not offered.
  cli_client_id: ${KEYCLOAK_CLI_CLIENT_ID:}
  # When set, Bearer tokens must also name this in aud; set it once every client's tokens do.
  required_audience: ${KEYCLOAK_REQUIRED_AUDIENCE:}
  # Portal sessions end at this age however active they are (8h or PT8H).
  session_max_age: ${SESSION_MAX_AGE:8h}

### EXTERNAL SERVICES ###
services:
  exaflow:
    # Sent as a Bearer token to Exaflow, which requires it when its EXAFLOW_API_TOKEN is set.
    apiToken: ${EXAFLOW_API_TOKEN:}
    analysisUrl: ${EXAFLOW_URL:http://127.0.0.1:5000}/analysis
    inputdataSpecUrl: ${EXAFLOW_URL:http://127.0.0.1:5000}/specifications/inputdata
    preprocessingSpecUrl: ${EXAFLOW_URL:http://127.0.0.1:5000}/specifications/preprocessing
    algorithmsSpecUrl: ${EXAFLOW_URL:http://127.0.0.1:5000}/specifications/algorithms
    attributesUrl: ${EXAFLOW_URL:http://127.0.0.1:5000}/data_models_attributes
    datasets_variables: ${EXAFLOW_URL:http://127.0.0.1:5000}/datasets_variables
    cdesMetadataUrl: ${EXAFLOW_URL:http://127.0.0.1:5000}/cdes_metadata

frontend:
  base-url: ${PLATFORM_UI_BASE_URL:http://localhost:4200}

### EXPERIMENTS ###
experiments:
  # How long an unsaved studio run stays available to "Save experiment" without re-running it.
  run-draft-ttl: ${EXPERIMENT_RUN_DRAFT_TTL:PT24H}

### PLATFORM VERSION ###
mip:
  version: ${MIP_VERSION:dev}
